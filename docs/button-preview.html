<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Button preview · 店铺账本</title>
  <link rel="stylesheet" href="../app/static/style.css">
  <style>
    body { padding: 40px 24px; }
    .preview-shell { max-width: 860px; margin: 0 auto; }
    .preview-head { display: grid; gap: 8px; margin-bottom: 28px; }
    .preview-head p { color: var(--muted); }
    .preview-card { display: grid; gap: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow-sm); }
    .preview-row { display: grid; grid-template-columns: 150px minmax(0, 1fr) 1fr; gap: 20px; align-items: center; min-height: 74px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
    .preview-row:last-child { border-bottom: 0; }
    .preview-label { color: var(--ink-2); font-size: 13px; font-weight: 700; }
    .preview-note { color: var(--muted); font-size: 12px; }
    .preview-row .button { justify-self: start; }
    @media (max-width: 640px) {
      body { padding: 24px 14px; }
      .preview-row { grid-template-columns: 1fr; gap: 8px; }
      .preview-note { display: none; }
    }
  </style>
</head>
<body class="ui-v2">
  <main class="preview-shell">
    <header class="preview-head">
      <h1>按钮状态预览</h1>
      <p>生产按钮共享这套状态。此页面只用于组件验收。</p>
    </header>
    <section class="preview-card" aria-label="按钮八种状态">
      <div class="preview-row"><span class="preview-label">默认</span><button class="button primary" type="button">保存订单</button><span class="preview-note">静止状态</span></div>
      <div class="preview-row"><span class="preview-label">悬停</span><button class="button primary is-hover" type="button">保存订单</button><span class="preview-note">鼠标设备才启用</span></div>
      <div class="preview-row"><span class="preview-label">键盘聚焦</span><button class="button outline is-focus" type="button">查看订单</button><span class="preview-note">outline 不改变布局</span></div>
      <div class="preview-row"><span class="preview-label">按下</span><button class="button secondary is-active" type="button">导入采购单</button><span class="preview-note">按下时向下 1px</span></div>
      <div class="preview-row"><span class="preview-label">禁用</span><button class="button primary" type="button" disabled>删除订单</button><span class="preview-note">原生 disabled + 光标 + 透明度</span></div>
      <div class="preview-row"><span class="preview-label">加载</span><button class="button primary" type="button" data-state="loading" aria-busy="true" aria-disabled="true" disabled style="--busy-width: 132px"><span>正在导入…</span></button><span class="preview-note">保留按钮宽度</span></div>
      <div class="preview-row"><span class="preview-label">错误</span><button class="button" type="button" data-state="error">重新检查</button><span class="preview-note">错误状态仍可继续操作</span></div>
      <div class="preview-row"><span class="preview-label">成功</span><button class="button" type="button" data-state="success">已保存</button><span class="preview-note">安静反馈，不额外庆祝</span></div>
    </section>
  </main>
</body>
</html>
