[project]
name = "multistore-ai-ops"
version = "0.1.0"
description = "AI-assisted merchant operations workbench for order, cost, refund, and cashflow reconciliation"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.14,<2",
  "openpyxl>=3.1,<4",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "pwdlib[argon2]>=0.2,<1",
]
[dependency-groups]
dev = ["pytest>=8.3,<10"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
