name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Root Ledger & AI Ops
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -q

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Check migrations
        run: uv run alembic check

  plan1-test:
    name: Plan 1 Auto-Restock
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plan1_auto_restock
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run plan1 tests
        run: pytest -q

  plan2-backend-test:
    name: Plan 2 Redeem Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plan2_redeem_service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run plan2 backend tests
        run: pytest -q

  plan2-frontend-check:
    name: Plan 2 Redeem Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plan2_redeem_service/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plan2_redeem_service/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Verify committed frontend bundle
        shell: bash
        run: |
          set -eu
          if [ -n "$(git status --short --untracked-files=all -- frontend/dist)" ]; then
            echo "frontend/dist contains untracked build output. Run npm run build and commit the generated files." >&2
            git status --short --untracked-files=all -- frontend/dist >&2
            exit 1
          fi
          git diff --exit-code -- frontend/dist

  git-hygiene:
    name: Repo Hygiene & Secret Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate pre-commit hook syntax
        run: sh -n .githooks/pre-commit

      - name: Validate commit-msg hook syntax and behavior
        run: |
          set -eu
          sh -n .githooks/commit-msg
          message_file="$(mktemp)"
          trap 'rm -f "$message_file"' EXIT
          printf 'feat(ci): validate commit message hook\n' > "$message_file"
          .githooks/commit-msg "$message_file"
          printf 'invalid commit message\n' > "$message_file"
          if .githooks/commit-msg "$message_file"; then
            echo "commit-msg hook accepted an invalid message" >&2
            exit 1
          fi

      - name: Enable repository hooks
        run: |
          set -eu
          git config core.hooksPath .githooks
          test "$(git config --get core.hooksPath)" = ".githooks"

      - name: Verify no forbidden files are tracked
        run: |
          set -eu
          bad="$(git -c core.quotepath=false ls-files | grep -E '(^|/)(\.env(\.[^.]+)?|[^/]+\.local\.ya?ml|[^/]+\.(db|db-wal|db-shm|db-journal|sqlite|sqlite3|pem|key|p12|pfx))$|(^|/)(private|\.local_data|exports|data)/|^(history|work)/' | grep -Ev '(^|/)\.env\.example$' || true)"
          if [ -n "$bad" ]; then
            echo "Tracked forbidden files detected:" >&2
            echo "$bad" >&2
            exit 1
          fi
