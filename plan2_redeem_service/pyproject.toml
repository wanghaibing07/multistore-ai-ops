[project]
name = "plan2-redeem-service"
version = "1.0.0"
description = "Self-service redemption and fulfillment backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9,<1",
  "PyYAML>=6,<7",
  "telethon>=1.36,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-cov>=5,<6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.uvicorn]
factory = false

