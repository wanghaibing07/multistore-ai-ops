services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PLAN2_DB_PATH: /data/redeem.sqlite3
      PLAN2_STORAGE_DIR: /data/private
    volumes:
      - plan2_data:/data
    expose:
      - "8000"
    command:
      - /bin/sh
      - -ec
      - |
        if [ -z "$$PLAN2_ADMIN_TOKEN" ] || [ "$$PLAN2_ADMIN_TOKEN" = "replace-with-a-long-random-token" ] || [ "$$PLAN2_ADMIN_TOKEN" = "change-me" ]; then
          echo "Set a strong PLAN2_ADMIN_TOKEN in .env before starting" >&2
          exit 1
        fi
        exec uvicorn backend.main:app --host 0.0.0.0 --port 8000 --workers 1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  plan2_data:
  caddy_data:
  caddy_config:
